<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="style/style.css">

    <title>Wordle</title>
</head>

<body>
    <header>
        <button id="btn_help" class="top-btn">?</button>
        <h1>WORDLE</h1>
        <button class="top-btn new-game">!</button>

    </header>
    <div id="main_container">
        <div id="word_grid">
            <div id="row_1" class="row">
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
            </div>
            <div id="row_2" class="row">
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
            </div>
            <div id="row_3" class="row">
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
            </div>
            <div id="row_4" class="row">
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
            </div>
            <div id="row_5" class="row">
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
            </div>
            <div id="row_6" class="row">
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
            </div>
        </div>

        <div id="keyboard">
            <div class="row">
                <button class="key" id="kQ" value="Q">Q</button>
                <button class="key" id="kW" value="W">W</button>
                <button class="key" value="E">E</button>
                <button class="key" value="R">R</button>
                <button class="key" value="T">T</button>
                <button class="key" value="Y">Y</button>
                <button class="key" value="U">U</button>
                <button class="key" value="I">I</button>
                <button class="key" value="O">O</button>
                <button class="key" value="P">P</button>
            </div>
            <div class="row">
                <button class="key" value="A">A</button>
                <button class="key" value="S">S</button>
                <button class="key" value="D">D</button>
                <button class="key" value="F">F</button>
                <button class="key" value="G">G</button>
                <button class="key" value="H">H</button>
                <button class="key" value="J">J</button>
                <button class="key" value="K">K</button>
                <button class="key" value="L">L</button>
                <button class="key" value="Ñ">Ñ</button>
            </div>
            <div class="row">
                <button id="enter_key" class="key k-enter" value="ENTER">ENTER</button>
                <button class="key" value="Z">Z</button>
                <button class="key" value="X">X</button>
                <button class="key" value="C">C</button>
                <button class="key" value="V">V</button>
                <button class="key" value="B">B</button>
                <button class="key" value="N">N</button>
                <button class="key" value="M">M</button>
                <button class="key k-back" value="BACKSPACE">&#9003;</button>
            </div>
        </div>
        <div id="game-modal" class="hidden">
            <div class="modal-content">
                <div id="modal-header" class="">
                    <p id="modal-message"></p>
                </div>
                <p class="secret-word-text">The word was: <strong id="modal-secret-word"></strong></p>
                <div id="modal-body">
                    <button class="modal-btn new-game">Play Again</button>
                </div>
            </div>
        </div>
    </div>
    <script src="./build/src/app.js" type="module"></script>
</body>

</html>
